# The FGAC compiler as two serverless jobs (Databricks Asset Bundle). Deployed by: python3 -I poc.py deploy
#   fgac-compiler  runs whenever a policy export table changes (table-update trigger)
#   fgac-guardian  the same steps every hour (paused in the POC): repairs edited views, revokes unexpected
#                  privileges, recompiles if a trigger was missed
# Both run as the compiler service principal, which owns the catalog and the views.
bundle:
  name: fgac-compiler

variables:
  catalog:
    description: The POC catalog (must match config.json)
    default: fgac_poc
  job_prefix:
    description: Name prefix of the two jobs (must match config.json)
    default: fgac-
  compiler_app_id:
    description: Application ID of the compiler service principal (poc.py passes it)
  guardian_schedule:
    description: PAUSED (POC) or UNPAUSED (production)
    default: PAUSED

sync:
  include: [config.json, config.py, dbsql.py, compiler/*.py, tests/invariants.py]
  exclude: ["**/__pycache__/**", "setup/**", "tests/test_*.py", "poc.py"]

run_as:
  service_principal_name: ${var.compiler_app_id}

permissions:
  - level: CAN_RUN  # read the deployed code; the guardian (running as the compiler) starts the compiler job
    service_principal_name: ${var.compiler_app_id}
  - level: CAN_MANAGE
    user_name: ${workspace.current_user.userName}

targets:
  poc:
    default: true
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}

resources:
  jobs:
    fgac_compiler:
      name: ${var.job_prefix}compiler
      description: Compiles the policy exports into entitlements, secured views and audit views, guards privileges, checks invariants.
      max_concurrent_runs: 1
      queue: {enabled: true}
      trigger:
        pause_status: UNPAUSED
        table_update:
          condition: ANY_UPDATED
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 61
          table_names:
            - ${var.catalog}.policy.assoc_dim
            - ${var.catalog}.policy.assoc_roles_dim
            - ${var.catalog}.policy.persona
            - ${var.catalog}.policy.persona_column_policy
            - ${var.catalog}.policy.column_classification
            # the governed base tables too: a data load (a new column filled by ETL) regenerates the view; a dropped column alone
            # is metadata, does not fire the trigger, and the view fails closed until the next run (the guardian, hourly)
            - ${var.catalog}.hr_base.associate_compensation
            - ${var.catalog}.hr_base.associate_attrition
            - ${var.catalog}.hr_base.market_summary
      environments:
        - environment_key: default
          spec: {client: "3"}
      tasks:
        - task_key: entitlements
          environment_key: default
          spark_python_task: {python_file: compiler/fgac_compiler.py, parameters: [entitlements]}
        - task_key: views
          depends_on: [{task_key: entitlements}]
          environment_key: default
          spark_python_task: {python_file: compiler/fgac_compiler.py, parameters: [views]}
        - task_key: audit
          depends_on: [{task_key: views}]
          run_if: ALL_DONE  # the audit views do not depend on the secured views
          environment_key: default
          spark_python_task: {python_file: compiler/fgac_compiler.py, parameters: [audit]}
        - task_key: guard
          depends_on: [{task_key: audit}]
          run_if: ALL_DONE  # revoke stray privileges even when a view could not be built
          environment_key: default
          spark_python_task: {python_file: compiler/fgac_compiler.py, parameters: [guard]}
        - task_key: invariants
          depends_on: [{task_key: guard}]
          run_if: ALL_DONE
          environment_key: default
          spark_python_task: {python_file: tests/invariants.py}

    fgac_guardian:
      name: ${var.job_prefix}guardian
      description: Hourly repair (paused in the POC). It runs the compiler job, so every compile shares one queue and never overlaps another.
      max_concurrent_runs: 1
      trigger:
        pause_status: ${var.guardian_schedule}
        periodic: {interval: 1, unit: HOURS}
      tasks:
        - task_key: run_compiler
          run_job_task:
            job_id: ${resources.jobs.fgac_compiler.id}
